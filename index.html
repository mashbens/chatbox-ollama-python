<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stream Chat - ask-stream-simple</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; max-width:900px; margin:24px auto; padding:12px; }
    .card { border:1px solid #e3e3e3; border-radius:8px; padding:12px; box-shadow:0 2px 6px rgba(0,0,0,0.03); }
    textarea, input { width:100%; box-sizing:border-box; padding:8px; font-size:14px; }
    #output { min-height:120px; white-space:pre-wrap; background:#0f1720; color:#e6eef8; padding:12px; border-radius:6px; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace; }
    .controls { display:flex; gap:8px; margin-top:8px; }
    button { padding:8px 12px; border-radius:6px; cursor:pointer; }
    .small { width:160px; }
    label { font-size:13px; margin-bottom:6px; display:block; }
    .hint { color:#666; font-size:13px; margin-top:8px; }
  </style>
</head>
<body>
  <h2>Stream demo — ask-stream-simple</h2>

  <div class="card">
    <label>Endpoint URL</label>
    <input id="url" value="http://10.60.2.15:31131/ask-stream-simple" />

    <label style="margin-top:8px">Question</label>
    <textarea id="question" rows="3">rangkum pdf ini?</textarea>

    <label style="margin-top:8px">Module</label>
    <input id="module" value="mekaar" />

    <div class="controls">
      <button id="start">Start Stream</button>
      <button id="stop" disabled>Stop</button>
      <button id="clear">Clear</button>
    </div>

    <p class="hint">Catatan: pastikan server mengizinkan CORS agar browser bisa akses API langsung.</p>
  </div>

  <h3>Output</h3>
  <div id="output" class="card"></div>

  <script>
  (function(){
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const clearBtn = document.getElementById('clear');
    const output = document.getElementById('output');
    const urlInput = document.getElementById('url');
    const questionInput = document.getElementById('question');
    const moduleInput = document.getElementById('module');

    let controller = null;
    let reader = null;
    let running = false;

    clearBtn.addEventListener('click', () => output.textContent = '');
    stopBtn.addEventListener('click', () => stopStream());
    startBtn.addEventListener('click', () => startStream());

    function appendText(t) {
      output.textContent += t;
      output.scrollTop = output.scrollHeight;
    }

    async function startStream() {
      if (running) return;
      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      output.textContent = '';

      const payload = {
        question: questionInput.value || "",
        module: moduleInput.value || ""
      };

      controller = new AbortController();
      try {
        const resp = await fetch(urlInput.value, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });

        if (!resp.ok) {
          appendText(`HTTP error: ${resp.status} ${resp.statusText}\n`);
          stopStream();
          return;
        }

        reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        function extractJSONObjects(str) {
          const objects = [];
          let startIndex = -1;
          let depth = 0;
          for (let i = 0; i < str.length; i++) {
            const ch = str[i];
            if (ch === '{') {
              if (depth === 0) startIndex = i;
              depth++;
            } else if (ch === '}') {
              depth--;
              if (depth === 0 && startIndex !== -1) {
                const objStr = str.slice(startIndex, i + 1);
                objects.push({ json: objStr, end: i + 1 });
                startIndex = -1;
              }
            }
          }
          return objects;
        }

        while (running) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          let keepFrom = 0;
          const objs = extractJSONObjects(buffer);
          for (const o of objs) {
            try {
              const parsed = JSON.parse(o.json);
              if (parsed.response !== undefined) appendText(parsed.response);
              if (parsed.done) {
                appendText('\n\n[STREAM DONE]\n');
                stopStream();
              }
            } catch (e) {
              appendText('\n[parse error]\n');
            }
            keepFrom = o.end;
          }
          buffer = buffer.slice(keepFrom);
        }

      } catch (err) {
        if (err.name === 'AbortError') appendText('\n[stream aborted]\n');
        else appendText('\n[error] ' + String(err) + '\n');
      } finally {
        running = false;
        startBtn.disabled = false;
        stopBtn.disabled = true;
        controller = null;
        reader = null;
      }
    }

    function stopStream() {
      if (!running) return;
      running = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      try { if (controller) controller.abort(); } catch (e) {}
    }

    window.addEventListener('beforeunload', () => {
      try { if (controller) controller.abort(); } catch(e){}
    });
  })();
  </script>
</body>
</html>
